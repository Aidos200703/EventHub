name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://eventhub:eventhub@localhost:5432/eventhub
  # CI-only secret; real deployments set their own.
  BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
  BETTER_AUTH_URL: http://localhost:3100
  NEXT_PUBLIC_APP_URL: http://localhost:3100
  NEXT_PUBLIC_DEMO_MODE: "true"
  DEMO_PASSWORD: eventhub-demo

jobs:
  checks:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  integration-e2e:
    name: Integration, build & E2E
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eventhub
          POSTGRES_PASSWORD: eventhub
          POSTGRES_DB: eventhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Integration tests clean up after themselves; re-seed for a predictable E2E state.
      - run: npm run db:seed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
